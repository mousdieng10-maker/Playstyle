<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playstyle</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body id="body">

  <!-- SIGNUP SCREEN -->
  <div class="flex" id="signupScreen">

    <div class="card">
      <img  src="assets/webtitle.png">

      <div class="loginTitle">
        <h3>Make your life a football game.</h3>
      </div>

      <h4 id="signupErrorMsg"></h4>

      <div class="loginSect">
        <label>Create Username</label>
        <input type="text" id="subUsernameInput" placeholder="type Username">
      </div>

      <div class="loginSect">
        <label>Create Password</label>
        <input type="password" id="subPasswordInput" placeholder="type Password">
      </div>

      <div class="loginSect">
        <label>Confirm Password</label>
        <input type="password" id="conSubPasswordInput" placeholder="type Password">
      </div>

      <div class="btnContainer">
        <button id="signupBtn">Join Playstyle</button>
      </div>

      <br><br>

      <h4>
        Already a member?
        <span id="pressOnLogin">Login</span>
      </h4>

    </div>

  </div>



  <!-- LOGIN SCREEN -->
  <div class="flex" id="loginScreen">

    <div class="card">

      <img src="assets/webtitle.png">

      <div class="loginTitle">
        <h3>Make your life a football game.</h3>
      </div>

      <h4 id="errorMsg"></h4>

      <div class="loginSect">
        <label>Username</label>
        <input type="text" id="usernameInput" placeholder="type Username">
      </div>

      <div class="loginSect">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="type Password">
      </div>

      <div class="btnContainer">
        <button id="loginBtn">Join Playstyle</button>
      </div>

      <br><br>

      <h4>
        Not a member?
        <span id="pressOn">Sign up</span>
      </h4>

    </div>

    <img class="title" src="assets/adidas.png">

  </div>



  <!-- MUSIC PLAYER -->

  <div class="musicPlayer" id="musicPlayer">

    <h3>Currently playing</h3>

    <img src="assets/daidai.png" id="musicWidget">

    <div class="player">
      <img id="playBackward" class="imgBtn" src="assets/skipBack.png">
      <img class="imgBtn" src="assets/playing.png">
      <img id="playForward" class="imgBtn" src="assets/playForward.png">
    </div>

  </div>



  <!-- HOME SCREEN -->

  <div id="homeScreen">
    <div class="nav">
      <div class="top-nav">
        <img src="assets/webtitle.png" id="icon">
      </div>
      <div class="lower-nav">
          <div class="middle-nav">
            <div id="homeBtn" class="nav-tab"><i class="fa-solid  navIcon fa-futbol"></i>      Home</div>
            <div id="cardBtn" class="nav-tab"><i class="fa-solid navIcon fa-address-card"></i>      Card</div>
            <div id="missionBtn" class="nav-tab"><i class="fa-solid navIcon fa-list"></i>      Missions</div>
            <div id="statBtn" class="nav-tab"><i class="fa-solid navIcon fa-chart-simple"></i>      Stats</div>
            <div id="leaderBtn" class="nav-tab"><i class="fa-solid navIcon fa-arrow-up-1-9"></i>      Leaderboard</div>
            <div id="profileBtn" class="nav-tab"><i class="fa-solid navIcon fa-user"></i>      Profile</div>
            <div id="settingsBtn" class="nav-tab"><i class="fa-solid navIcon fa-gear"></i>      Settings</div>
        </div>
        <div class="bottom-nav">
          <h3>Moustapha</h3>
        </div>
      </div>
    </div>
    <div class="homeSection">
      <div class="top">
        <h1 id="welcomeMsg"></h1>
        <div class="playstyleContainer">
          <h3 style="color:rgb(157,0,255);">Your Playstyle</h3>
          <div class="playstyle-icons">



            <div class="playstyle">
              <i class="fa-solid fa-bolt main"></i>
              <h3 class="styleTitle">PACE</h3>
              <h3 class="ovr"></h3>
            </div>
            <div class="playstyle">
              <i class="fa-solid fa-person-running main"></i>
              <h3 class="styleTitle">ACCELERATION</h3>
              <h3 class="ovr"></h3>

            </div>
            <div class="playstyle">
              <i class="fa-solid fa-dumbbell main"></i>
              <h3 class="styleTitle">PHYSICAL</h3>
              <h3 class="ovr"></h3>

            </div>
            <div class="playstyle">
              <i class="fa-solid fa-brain main"></i>
              <h3 class="styleTitle">META</h3>
              <h3 class="ovr"></h3>

            </div>
            <div class="playstyle">
              <i class="fa-solid fa-magnifying-glass main"></i>
              <h3 class="styleTitle">VISION</h3>
              <h3 class="ovr"></h3>

            </div>

          </div>
        </div>
      </div>
      <div class="bottom"></div>
    </div>

    
  </div>

  <div id="loadLoginScreen" class="flex">
      <div class="card">
        <div  class="init titlePlaceholder"></div>
        <div class="init slogan"></div>
        <div class="loadloginSect init"></div>
        <div class="loadloginSect init"></div>
        <div class="loadbtnContainer init"></div>
      </div>
      <br><br>
      <div class="imgload init"></div>
      
      </div>
  </div>
  

<script type="module" src="script.js"></script>

</body>
</html>
